paths:
  /api/admin/stats:
    get:
      summary: Загальна статистика платформи
      description: Тільки для адміністраторів.
      tags: [Admin]
      security:
        - cookieAuth: []
      responses:
        200:
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PlatformStats'
        403:
          description: Відмовлено в доступі (не адмін)



  /api/admin/users:
    get:
      summary: Список користувачів
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: Список користувачів
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'

  /api/admin/campaigns:
    get:
      summary: Список кампаній (Адмін)
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: visibility
          schema:
            type: string
            enum: [PUBLIC, PRIVATE, LINK_ONLY]
      responses:
        200:
          description: Список кампаній

  /api/admin/campaigns/{id}:
    delete:
      summary: Видалити кампанію (Адмін)
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Кампанію успішно видалено

  /api/admin/sessions:
    get:
      summary: Список сесій (Адмін)
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [PLANNED, ACTIVE, FINISHED, CANCELED]
      responses:
        200:
          description: Список сесій

  /api/admin/sessions/{id}:
    delete:
      summary: Видалити сесію (Адмін)
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Сесію успішно видалено

  /api/admin/users/{id}/ban:
    post:
      summary: Заблокувати користувача
      description: Додає користувача в Redis-блекліст, завершує його кампанії, скасовує ігри, відв'язує Telegram та анулює токени.
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Користувача успішно заблоковано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Користувача "username" успішно заблоковано
        400:
          description: Помилка валідації (наприклад, бан самого себе)
        403:
          description: Недостатньо прав (не адмін або спроба забанити іншого адміна)
        404:
          description: Користувача не знайдено

  /api/admin/users/{id}/unban:
    post:
      summary: Розблокувати користувача
      description: Знімає блокування та прибирає користувача з Redis-блекліста.
      tags: [Admin]
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Користувача успішно розблоковано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Користувача "username" успішно розблоковано
        403:
          description: Недостатньо прав
        404:
          description: Користувача не знайдено
