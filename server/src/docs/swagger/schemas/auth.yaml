components:
  schemas:
    RegisterInput:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        username:
          type: string
          minLength: 3
          maxLength: 30

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required:
        - resetToken
        - newPassword
      properties:
        resetToken:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
