name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install and build server prerequisites
        run: |
          npm ci
          npm audit --audit-level=high
          npm --workspace server exec prisma generate

  build_client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install and build client
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build:client

  lint_client:
    runs-on: ubuntu-latest
    needs: build_client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint:client

  lint_server:
    runs-on: ubuntu-latest
    needs: build_server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint:server

  coverage_client:
    runs-on: ubuntu-latest
    needs: build_client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Generate client coverage
        run: npm run test:coverage:client

      - name: Upload client coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          if-no-files-found: error

  coverage_server:
    runs-on: ubuntu-latest
    needs: lint_server
    env:
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/ttrpg_test?schema=public"
      REDIS_URL: "redis://localhost:6380"
      COOKIE_SECRET: "dummy_cookie"
      JWT_SECRET: "dummy_jwt"
      SHARE_TOKEN_SECRET: "dummy_share"
      POSTGRES_USER: "dummy_user"
      POSTGRES_PASSWORD: "dummy_pass"
      POSTGRES_DB: "dummy_db"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Start test databases (Postgres & Redis)
        run: |
          docker compose --profile test up -d db_test redis_test
          sleep 10 # Чекаємо, поки бази повністю ініціалізуються

      - name: Install server dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace server exec prisma generate

      - name: Push database schema
        run: npm --workspace server exec prisma db push --accept-data-loss

      - name: Generate server coverage
        run: npm run test:coverage:server

      - name: Stop test databases
        if: always() 
        run: docker compose --profile test down -v

      - name: Upload server coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          if-no-files-found: error

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [coverage_client, coverage_server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download client coverage
        uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: .

      - name: Download server coverage
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (Vulnerability Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
