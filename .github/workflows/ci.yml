name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (Vulnerability Scanner)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  lint_client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=client

  lint_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=server

  build_client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=client

  build_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace server exec prisma generate

  coverage_client:
    runs-on: ubuntu-latest
    needs: [lint_client, build_client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:coverage --workspace=client
      - uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          if-no-files-found: error

  coverage_server:
    runs-on: ubuntu-latest
    needs: [lint_server, build_server]
    env:
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/ttrpg_test?schema=public"
      REDIS_URL: "redis://localhost:6380"
      COOKIE_SECRET: "dummy_cookie"
      JWT_SECRET: "dummy_jwt"
      SHARE_TOKEN_SECRET: "dummy_share"
      POSTGRES_USER: "dummy_user"
      POSTGRES_PASSWORD: "dummy_pass"
      POSTGRES_DB: "dummy_db"
      EMAIL_PROVIDER: "disabled"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Start test databases
        run: docker compose --profile test up -d --wait db_test redis_test
      - run: npm ci
      - run: npm --workspace server exec prisma generate
      - run: npm --workspace server exec prisma db push --accept-data-loss
      - run: npm run test:coverage --workspace=server
      - if: always() 
        run: docker compose --profile test down -v
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          if-no-files-found: error

  e2e_tests:
    runs-on: ubuntu-latest
    needs: [coverage_client, coverage_server]
    env:
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/ttrpg_test?schema=public"
      REDIS_URL: "redis://localhost:6380"
      COOKIE_SECRET: "dummy_cookie"
      JWT_SECRET: "dummy_jwt"
      SHARE_TOKEN_SECRET: "dummy_share"
      POSTGRES_USER: "dummy_user"
      POSTGRES_PASSWORD: "dummy_pass"
      POSTGRES_DB: "dummy_db"
      EMAIL_PROVIDER: "disabled"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./client
        
      - name: Start Databases
        run: docker compose --profile test up -d --wait db_test redis_test
          
      - name: Setup DB Schema
        run: |
          npm --workspace server exec prisma generate
          npm --workspace server exec prisma db push --accept-data-loss
          
      - name: Start Server
        run: npm run dev --workspace=server &
        env:
          NODE_ENV: test
          PORT: "3000"
          RUN_MIGRATIONS: "false"
          
      - name: Wait for Server
        run: |
          echo "Waiting for server to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              echo "Server is ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i/20 failed, retrying in 3s..."
            sleep 3
          done
          echo "Server did not start in time"
          exit 1
          
      - name: Run E2E Tests
        run: npm run test:e2e --workspace=client
        
      - if: always()
        name: Stop Databases
        run: docker compose --profile test down -v
        
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

  sonarcloud:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [coverage_client, coverage_server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: client-coverage
          path: client/coverage
      - uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
