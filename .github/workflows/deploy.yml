name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Generate Docker tags
        id: tags
        run: |
          SERVER_TAGS="ghcr.io/${REPO_LC}/server:${{ github.sha }},ghcr.io/${REPO_LC}/server:latest"
          CLIENT_TAGS="ghcr.io/${REPO_LC}/client:${{ github.sha }},ghcr.io/${REPO_LC}/client:latest"
          echo "server_tags=${SERVER_TAGS}" >> $GITHUB_OUTPUT
          echo "client_tags=${CLIENT_TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          target: production
          build-args: |
            VITE_API_URL=/api
            VITE_TELEGRAM_BOT_USERNAME=${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          push: true
          tags: ${{ steps.tags.outputs.client_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_docker
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            git pull origin main
            export IMAGE_TAG=${{ github.sha }}
            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull
            echo "Starting containers..."
            if ! docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait --wait-timeout 180; then
              echo "Deployment failed! Rolling back to the previous version..."
              git reset --hard HEAD@{1}
              export IMAGE_TAG=$(git rev-parse HEAD)
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
              exit 1
            fi
            docker image prune -f
