name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            git pull origin main
            echo "Building and starting containers. Waiting for health checks..."
            if ! docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait --wait-timeout 180; then
              echo "Deployment failed! Rolling back to the previous version..."
              git reset --hard HEAD@{1}
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
              exit 1
            fi
            docker image prune -f