stages:
  - fast_checks
  - test
  - e2e
  - sonar

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'


variables:
  GIT_CLEAN_FLAGS: "-ffdx -e .npm/ -e .ci-tools/"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build_server:
  stage: fast_checks
  tags: [student]
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm audit --audit-level=high
    - cd server
    - npx prisma generate
  artifacts:
    paths:
      - node_modules/.prisma/
      - node_modules/@prisma/client/
    expire_in: 1 hour

build_client:
  stage: fast_checks
  tags: [student]
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm audit --audit-level=high
    - npm run build --workspace=client

lint_client:
  stage: fast_checks
  tags: [student]
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run lint --workspace=client

lint_server:
  stage: fast_checks
  tags: [student]
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run lint --workspace=server

coverage_client:
  stage: test
  tags: [student]
  needs: [build_client, lint_client]
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run test:coverage --workspace=client
  coverage: '/Lines\s*:\s*([0-9.]+)%/'
  artifacts:
    paths:
      - client/coverage/
    expire_in: 7 days

coverage_server:
  stage: test
  tags: [student]
  needs: [build_server, lint_server]
  variables:
    DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/ttrpg_test?schema=public"
    REDIS_URL: "redis://localhost:6380"
    COOKIE_SECRET: "dummy_cookie"
    JWT_SECRET: "dummy_jwt"
    SHARE_TOKEN_SECRET: "dummy_share"
    POSTGRES_USER: "dummy_user"
    POSTGRES_PASSWORD: "dummy_pass"
    POSTGRES_DB: "dummy_db"
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - docker compose --profile test up -d db_test redis_test
    - |
      $timeout = 60; $elapsed = 0
      do {
        $db    = (Test-NetConnection -ComputerName localhost -Port 5433 -WarningAction SilentlyContinue).TcpTestSucceeded
        $redis = (Test-NetConnection -ComputerName localhost -Port 6380 -WarningAction SilentlyContinue).TcpTestSucceeded
        if ($db -and $redis) { Write-Host "DB and Redis ready"; break }
        Start-Sleep -Seconds 3; $elapsed += 3
        if ($elapsed -ge $timeout) { Write-Error "Timeout waiting for test services"; exit 1 }
      } while ($true)
    - cd server
    - npx prisma generate
    - npx prisma db push --accept-data-loss
    - cd ..
    - npm run test:coverage --workspace=server
  after_script:
    - docker compose --profile test down -v
  coverage: '/Lines\s*:\s*([0-9.]+)%/'
  artifacts:
    paths:
      - server/coverage/
    expire_in: 7 days

e2e_tests:
  stage: e2e
  tags: [student]
  needs: [coverage_client, coverage_server]
  variables:
    DATABASE_URL: "postgresql://testuser:testpass@localhost:5433/ttrpg_test?schema=public"
    REDIS_URL: "redis://localhost:6380"
    COOKIE_SECRET: "dummy_cookie"
    JWT_SECRET: "dummy_jwt"
    SHARE_TOKEN_SECRET: "dummy_share"
    POSTGRES_USER: "dummy_user"
    POSTGRES_PASSWORD: "dummy_pass"
    POSTGRES_DB: "dummy_db"
    PORT: "3000"
    RUN_MIGRATIONS: "false"
  script:
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - cd client
    - npx playwright install --with-deps
    - cd ..
    - docker compose --profile test up -d db_test redis_test
    - |
      $timeout = 60; $elapsed = 0
      do {
        $db    = (Test-NetConnection -ComputerName localhost -Port 5433 -WarningAction SilentlyContinue).TcpTestSucceeded
        $redis = (Test-NetConnection -ComputerName localhost -Port 6380 -WarningAction SilentlyContinue).TcpTestSucceeded
        if ($db -and $redis) { Write-Host "DB and Redis ready"; break }
        Start-Sleep -Seconds 3; $elapsed += 3
        if ($elapsed -ge $timeout) { Write-Error "Timeout waiting for test services"; exit 1 }
      } while ($true)
    - cd server
    - npx prisma generate
    - npx prisma db push --accept-data-loss
    - cd ..

    - Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "npm run dev --workspace=server" -WindowStyle Hidden -RedirectStandardOutput "server.log" -RedirectStandardError "server_err.log"
    - |
      $timeout = 60; $elapsed = 0
      do {
        try {
          $r = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
          if ($r.StatusCode -eq 200) { Write-Host "Server ready"; break }
        } catch {}
        Start-Sleep -Seconds 3; $elapsed += 3
        if ($elapsed -ge $timeout) { Write-Error "Timeout waiting for server"; exit 1 }
      } while ($true)

    - cd client
    - npm run build

    - Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "npx vite preview --port 4173" -WindowStyle Hidden -RedirectStandardOutput "preview.log" -RedirectStandardError "preview_err.log"
    - Start-Sleep -Seconds 3
    - cd ..
    - |
      npm run test:e2e --workspace=client
      $exitCode = $LASTEXITCODE
      Stop-Process -Name node -Force -ErrorAction SilentlyContinue
      if ($exitCode -ne 0) { exit $exitCode }
  after_script:
    - docker compose --profile test down -v
    - Stop-Process -Name node -Force -ErrorAction SilentlyContinue
  artifacts:
    when: on_failure
    paths:
      - client/playwright-report/
    expire_in: 30 days

sonarcloud_scan:
  stage: sonar
  tags: [student]
  needs:
    - coverage_client
    - coverage_server
  variables:
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"
  script:
    - $ErrorActionPreference = "Stop"
    - $toolsDir = "$env:CI_PROJECT_DIR\.ci-tools"
    - $javaHome = "$toolsDir\jdk-17"
    - if (!(Test-Path "$javaHome\bin\java.exe")) { New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null }
    - if (!(Test-Path "$javaHome\bin\java.exe")) { Invoke-WebRequest -Uri "https://aka.ms/download-jdk/microsoft-jdk-17.0.11-windows-x64.zip" -OutFile "$toolsDir\jdk17.zip" }
    - if (!(Test-Path "$javaHome\bin\java.exe")) { Expand-Archive -Path "$toolsDir\jdk17.zip" -DestinationPath "$toolsDir\jdk17-unpacked" -Force }
    - if (!(Test-Path "$javaHome\bin\java.exe")) { $extracted = Get-ChildItem -Path "$toolsDir\jdk17-unpacked" -Directory | Select-Object -First 1; Move-Item -Path $extracted.FullName -Destination $javaHome }
    - $env:JAVA_HOME = $javaHome
    - $env:Path = "$env:JAVA_HOME\bin;$env:Path"
    - java -version
    - $env:CI_MERGE_REQUEST_IID = ""
    - $env:SONAR_SCANNER_JAVA_EXE_PATH = "$javaHome\bin\java.exe"
    - npx sonarqube-scanner "-Dsonar.host.url=https://sonarcloud.io" "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.branch.name=$env:CI_COMMIT_REF_NAME" "-Dsonar.scanner.javaExePath=$javaHome\bin\java.exe"
