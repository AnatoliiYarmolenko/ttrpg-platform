services:
  # 1. Сервіс Бази Даних
  db:
    image: postgres:15
    container_name: ttrpg_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer
    restart: always
    profiles:
      - debug
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  redis:
    image: redis:7-alpine
    container_name: ttrpg_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # 2. Сервіс Бекенду
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ttrpg_server
    ports:
      - "${SERVER_PORT:-5000}:5000" # Зліва порт на ПК, справа - в контейнері
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://ttrpg_redis:6379}
      PORT: ${SERVER_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      HOME_ACTIVE_MAX_AGE_HOURS: ${HOME_ACTIVE_MAX_AGE_HOURS:-24}
      HOME_PLANNED_TOLERANCE_MINUTES: ${HOME_PLANNED_TOLERANCE_MINUTES:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:?Set SHARE_TOKEN_SECRET}
      EXPOSE_AUTH_DEBUG_TOKENS: ${EXPOSE_AUTH_DEBUG_TOKENS:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      TOKEN_CLEANUP_SCHEDULE: ${TOKEN_CLEANUP_SCHEDULE:-0 2 * * *}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Зберігаємо завантажені файли (аватари) між перезапусками
      - uploads_data:/app/server/uploads

  # 3. Сервіс Фронтенду
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: ttrpg_client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    volumes:
      - ./client:/app/client
      - /app/node_modules

# Сховище для бази даних, щоб дані не зникали після перезавантаження
volumes:
  db_data:
  uploads_data:
  redis_data:
