services:
  # 1. Сервіс Бази Даних
  db:
    image: postgres:15
    container_name: ttrpg_db_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer
    container_name: ttrpg_adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
  
  dozzle:
    image: amir20/dozzle:latest
    container_name: ttrpg_dozzle
    restart: always
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  
  redis:
    image: redis:7-alpine
    container_name: ttrpg_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Test database for integration tests
  db_test:
    image: postgres:15
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-testpass}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-ttrpg_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-testuser} -d ${POSTGRES_TEST_DB:-ttrpg_test}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Test Redis for integration tests
  redis_test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # 2. Сервіс Бекенду
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ttrpg_server
    ports:
      - "${SERVER_PORT:-5000}:5000"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}/udp"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://ttrpg_redis:6379}
      PORT: ${SERVER_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      HOME_ACTIVE_MAX_AGE_HOURS: ${HOME_ACTIVE_MAX_AGE_HOURS:-24}
      HOME_PLANNED_TOLERANCE_MINUTES: ${HOME_PLANNED_TOLERANCE_MINUTES:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:?Set SHARE_TOKEN_SECRET}
      EXPOSE_AUTH_DEBUG_TOKENS: ${EXPOSE_AUTH_DEBUG_TOKENS:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      TOKEN_CLEANUP_SCHEDULE: ${TOKEN_CLEANUP_SCHEDULE:-0 2 * * *}
      # --- WebRTC / Call ---
      WS_CALL_PATH: ${WS_CALL_PATH:-/ws/call}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_MIN_PORT: ${MEDIASOUP_MIN_PORT:-40000}
      MEDIASOUP_MAX_PORT: ${MEDIASOUP_MAX_PORT:-49999}
      # --- TURN ---
      TURN_ENABLED: ${TURN_ENABLED:-false}
      TURN_URL: ${TURN_URL:-turn:127.0.0.1:3478}
      TURN_REALM: ${TURN_REALM:-ttrpg.local}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-change_me_turn_shared_secret}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      TURN_TRANSPORT: ${TURN_TRANSPORT:-udp}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Зберігаємо завантажені файли (аватари) між перезапусками
      - uploads_data:/app/server/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # TURN-сервер для локальної розробки (profile: turn)
  # Між вкладками одного браузера TURN не потрібен.
  # Запуск: docker compose --profile turn up
  coturn:
    image: coturn/coturn:latest
    container_name: ttrpg_coturn
    profiles: ["turn"]
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50000-50499:50000-50499/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_data:/var/lib/coturn
    command: >
      -c /etc/coturn/turnserver.conf
      --use-auth-secret
      --static-auth-secret=${TURN_SHARED_SECRET:-change_me_turn_shared_secret}
      --realm=${TURN_REALM:-ttrpg.local}

  # 3. Сервіс Фронтенду
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
    container_name: ttrpg_client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
    volumes:
      - ./client:/app/client
      - /app/node_modules

# Сховище для бази даних, щоб дані не зникали після перезавантаження
volumes:
  db_data:
  uploads_data:
  redis_data:
  coturn_data:
