# =============================================================================
# coturn Configuration - Local Development (Docker Compose)
# =============================================================================
# This file is for LOCAL development only.
# Production coturn runs directly on the host (systemd service),
# configured via /etc/turnserver.conf on the server.
#
# WARNING: TURN is NOT required for local dev between tabs of the same browser.
#          Enable TURN_ENABLED=true only when testing NAT traversal scenarios.
# =============================================================================

# --- Listening ports ---------------------------------------------------------
# Standard TURN/STUN port (UDP + TCP)
listening-port=3478

# --- Network -----------------------------------------------------------------
# Listen on all interfaces inside container
listening-ip=0.0.0.0

# External IP announced to clients in ICE candidates.
# For local dev: 127.0.0.1 is fine.
# For production: set to the real public IP of the server.
external-ip=127.0.0.1

# --- Relay ports -------------------------------------------------------------
# UDP port range for relayed media.
# Use a SEPARATE range from mediasoup (40000-49999) to avoid collisions.
min-port=50000
max-port=50499

# --- Authentication ----------------------------------------------------------
# Локальний dev-конфіг теж узгоджений із production-підходом:
# credentials мають генеруватись сервером через HMAC shared secret.
# Сам secret підставляється через docker-compose command flags.

# Realm shown in error responses
realm=ttrpg.local

# SQLite DB лишається доступною для сумісності, але не є основним механізмом auth
userdb=/var/lib/coturn/turndb

# --- Security ----------------------------------------------------------------
no-loopback-peers
no-multicast-peers
no-stun-backward-compatibility

# --- Logging -----------------------------------------------------------------
# Log to stdout so Docker captures it
log-file=stdout
verbose
