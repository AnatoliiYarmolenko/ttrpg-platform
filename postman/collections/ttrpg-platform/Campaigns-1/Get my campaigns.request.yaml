$kind: http-request
name: Get my campaigns
url: "{{baseUrl}}/api/v1/campaigns"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Get campaigns success\", function () {\r

      pm.expect(pm.response.code).to.equal(200);\r

      });\r

      let data = {};\r

      try { data = pm.response.json(); } catch (e) {}\r

      pm.test(\"Response is array or has items field\", function () {\r

      const ok = Array.isArray(data) || Array.isArray(data.items);\r

      pm.expect(ok).to.be.true;\r

      });"
    language: text/javascript
