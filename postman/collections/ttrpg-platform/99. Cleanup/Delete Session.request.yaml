$kind: http-request
name: Delete Session
url: "{{baseUrl}}/api/v1/sessions/{{session_id}}"
method: DELETE
headers:
  X-CSRF-Token: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: "const sessionId = pm.environment.get(\"session_id\");\r\nconst numericSessionId = Number.parseInt(sessionId, 10);\r\n\r\nif (!sessionId || Number.isNaN(numericSessionId) || numericSessionId <= 0) {\r\n  throw new Error(\"session_id is missing or invalid. Run Create Session before Cleanup.\");\r\n}"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Delete Session success\", function () {\r\n  pm.expect([200, 204]).to.include(pm.response.code);\r\n});\r\n\r\nif (pm.response.code === 200 || pm.response.code === 204) {\r\n  pm.environment.set(\"session_id\", \"\");\r\n  console.log(\"Session deleted successfully\");\r\n}"
    language: text/javascript
order: 101
