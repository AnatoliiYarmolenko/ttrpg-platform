$kind: http-request
name: Reset password
url: "{{baseUrl}}/api/v1/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_token}}"
body:
  type: json
  content: "{\r\n  \"resetToken\": \"{{reset_token}}\",\r\n  \"newPassword\": \"NewPassword123!\"\r\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Reset password success\", function () {\r

      pm.expect([200, 204]).to.include(pm.response.code);\r

      });"
    language: text/javascript
order: 4503484379245850
