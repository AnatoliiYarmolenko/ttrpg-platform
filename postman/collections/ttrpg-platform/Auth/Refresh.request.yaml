$kind: http-request
name: Refresh
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  X-CSRF-Token: "{{csrf_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Refresh success\", function () {\r

      pm.expect([200, 201]).to.include(pm.response.code);\r

      });\r

      \r

      const csrf = pm.response.headers.get(\"X-CSRF-Token\") ||
      pm.response.headers.get(\"x-csrf-token\");\r

      if (csrf) {\r

      pm.environment.set(\"csrf_token\", csrf);\r

      }"
    language: text/javascript
order: 4479977642554580
