$kind: http-request
name: Get CSRF token
url: "{{baseUrl}}/api/v1/auth/csrf-token"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"CSRF endpoint success\", function () {\r

      \    pm.expect(pm.response.code).to.equal(200);\r

      });\r

      \r

      const csrfHeader = pm.response.headers.get(\"X-CSRF-Token\") ||
      pm.response.headers.get(\"x-csrf-token\");\r

      if (csrfHeader) {\r

      \    pm.environment.set(\"csrf_token\", csrfHeader);\r

      \    console.log(\"csrf_token збережено з response header\");\r

      }"
    language: text/javascript
order: 1544755071034926
