$kind: http-request
name: Login
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_token}}"
body:
  type: json
  content: "{\r

    \    \"email\": \"test1@example.com\",\r

    \    \"password\": \"Password123!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Login success\", function () {\r

      \    pm.expect([200, 201]).to.include(pm.response.code);\r

      });\r

      \r

      let data = {};\r

      try {\r

      \    data = pm.response.json();\r

      } catch (e) {}\r

      \r

      // Збережемо user для зручності\r

      if (data.user) {\r

      \    pm.environment.set(\"user_id\", String(data.user.id || \"\"));\r

      \    pm.environment.set(\"username\", String(data.user.username ||
      \"\"));\r

      }\r

      \r

      // Перевірка, що сервер виставив auth cookies\r

      const setCookie = pm.response.headers.all()\r

      \    .filter(h => h.key.toLowerCase() === \"set-cookie\")\r

      \    .map(h => h.value);\r

      \r

      const hasAccessCookie = setCookie.some(v => v.startsWith(\"token=\"));\r

      const hasRefreshCookie = setCookie.some(v =>
      v.startsWith(\"refreshToken=\"));\r

      \r

      pm.test(\"Auth cookies are set\", function () {\r

      \    pm.expect(hasAccessCookie || hasRefreshCookie).to.be.true;\r

      });\r

      \r

      // Якщо сервер повертає CSRF у заголовку — теж збережемо\r

      const csrf = pm.response.headers.get(\"X-CSRF-Token\") ||
      pm.response.headers.get(\"x-csrf-token\");\r

      if (csrf) {\r

      \    pm.environment.set(\"csrf_token\", csrf);\r

      }"
    language: text/javascript
order: 4329295539481005
