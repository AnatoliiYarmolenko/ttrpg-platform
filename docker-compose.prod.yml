services:
  # ─── База даних ───────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: ttrpg_db
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ttrpg_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── Бекенд ───────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ttrpg_server
    restart: always
    expose:
      - "5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://ttrpg_redis:6379}
      PORT: 5000
      NODE_ENV: production
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TRUST_PROXY: 1
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      HOME_ACTIVE_MAX_AGE_HOURS: ${HOME_ACTIVE_MAX_AGE_HOURS:-24}
      HOME_PLANNED_TOLERANCE_MINUTES: ${HOME_PLANNED_TOLERANCE_MINUTES:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:?Set SHARE_TOKEN_SECRET}
      EXPOSE_AUTH_DEBUG_TOKENS: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      TOKEN_CLEANUP_SCHEDULE: ${TOKEN_CLEANUP_SCHEDULE:-0 2 * * *}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/server/uploads
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Фронтенд (nginx) ─────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_API_URL: /api
    container_name: ttrpg_client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    networks:
      - internal

# ─── Мережа ───────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ─── Сховища ──────────────────────────────────────────────────────
volumes:
  db_data:
  uploads_data:
  redis_data:
