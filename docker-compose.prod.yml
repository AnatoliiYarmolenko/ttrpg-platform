services:
  # ─── База даних ───────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: ttrpg_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ttrpg_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── Бекенд ───────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ttrpg_server
    restart: always
    # Mediasoup UDP порти: НЕ проксюємо через Docker ports!
    # UFW вже відкрив 40000-40499/udp на рівні хоста.
    # Щоб mediasoup отримував пакети напряму — server використовує host network.
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      PORT: 5000
      NODE_ENV: production
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TRUST_PROXY: 1
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      HOME_ACTIVE_MAX_AGE_HOURS: ${HOME_ACTIVE_MAX_AGE_HOURS:-24}
      HOME_PLANNED_TOLERANCE_MINUTES: ${HOME_PLANNED_TOLERANCE_MINUTES:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:?Set SHARE_TOKEN_SECRET}
      EXPOSE_AUTH_DEBUG_TOKENS: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      TOKEN_CLEANUP_SCHEDULE: ${TOKEN_CLEANUP_SCHEDULE:-0 2 * * *}
      # --- WebRTC / Call ---
      WS_CALL_PATH: ${WS_CALL_PATH:-/ws/call}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?Set MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_MIN_PORT: ${MEDIASOUP_MIN_PORT:-40000}
      MEDIASOUP_MAX_PORT: ${MEDIASOUP_MAX_PORT:-40499}
      # --- TURN (coturn на хості, не в Docker) ---
      TURN_ENABLED: ${TURN_ENABLED:-true}
      TURN_URL: ${TURN_URL:?Set TURN_URL}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      TURN_TRANSPORT: ${TURN_TRANSPORT:-udp}
      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_DOMAIN: ${TELEGRAM_WEBHOOK_DOMAIN}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/api/telegram/webhook}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/server/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Фронтенд (nginx) ─────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
    container_name: ttrpg_client
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    networks:
      - internal

# ─── Мережа ───────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ─── Сховища ──────────────────────────────────────────────────────
volumes:
  db_data:
  uploads_data:
  redis_data: